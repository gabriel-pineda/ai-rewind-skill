name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: setup-python has no 3.9 build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - run: pytest -q tests/test_privacy.py -k "no_network or no_dynamic_code or message_text or only_one_file"
      - name: Script runs with no network access
        run: |
          sudo unshare --net -- python3 -I skills/ai-wrapped/scripts/rewind.py \
            --claude-dir tests/fixtures/claude --tz UTC > /dev/null
